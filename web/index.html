<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dear-imgui-rs 0.22 - winit + wgpu (wasm32)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #d8d8e0;
        font: 14px/1.45 ui-monospace, monospace;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        box-shadow: 0 0 0 1px #333;
      }
      #error {
        position: fixed;
        inset: 24px;
        margin: 0;
        padding: 16px;
        overflow: auto;
        background: #1a1a22;
        border-left: 3px solid #c04;
        white-space: pre-wrap;
      }
    </style>
    <!-- The provider is an ES module; the import map must precede module scripts. -->
    <script type="importmap">
      {
        "imports": {
          "imgui-sys-v1": "./provider/imgui-sys-v1-wrapper.js"
        }
      }
    </script>
    <script>
      // Shared linear memory: the provider places its static data at 64 MiB and
      // grows upward; the Rust module's data stays in the low region.
      globalThis.__imgui_shared_memory = new WebAssembly.Memory({
        initial: 2048,
        maximum: 4096,
      });
    </script>
  </head>
  <body>
    <pre id="error" hidden></pre>
    <script type="module">
      const error = document.getElementById("error");
      try {
        const module = await import("./pkg/dear_imgui_demo.js");
        await module.default();
      } catch (cause) {
        error.hidden = false;
        error.textContent = `wasm initialization failed:\n${cause?.stack ?? String(cause)}`;
        console.error(cause);
      }
    </script>
  </body>
</html>
