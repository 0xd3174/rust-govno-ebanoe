<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dear-imgui-rs 0.22 - wasm32 probe</title>
    <style>
      body { margin: 0; background: #101014; color: #d8d8e0; font: 14px/1.45 ui-monospace, monospace; }
      main { padding: 24px; max-width: 1100px; }
      h1 { font-size: 16px; font-weight: 600; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: #1a1a22; border-left: 3px solid #c04; }
      .ok { border-left-color: #2a2; }
    </style>
  </head>
  <body>
    <main>
      <h1>dear-imgui-rs 0.22.0 wasm32-unknown-unknown probe</h1>
      <p>
        This page loads the Rust/wgpu/winit wasm build. A working build needs the
        <code>imgui-sys-v1</code> provider module that the crate imports from.
      </p>
      <pre id="log">loading wasm module...</pre>
    </main>
    <script type="module">
      const log = document.getElementById("log");
      const write = (text, ok = false) => {
        log.textContent = text;
        if (ok) log.classList.add("ok");
      };

      try {
        const module = await import("./pkg/dear_imgui_demo.js");
        await module.default();
        write("wasm module instantiated; winit event loop started", true);
      } catch (error) {
        write(`wasm load failed:\n${error?.stack ?? String(error)}`);
      }
    </script>
  </body>
</html>
